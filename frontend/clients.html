<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - CarWash Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav>
        <span class="brand">🚿 CarWash Manager</span>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="clients.html" class="active">Clientes</a>
            <a href="vehicles.html">Vehículos</a>
            <a href="services.html">Servicios</a>
            <a href="orders.html">Órdenes</a>
            <a href="employees.html">Empleados</a>
            <a href="reports.html">Reportes</a>
        </div>
        <div class="nav-actions">
            <button id="logoutBtn" class="btn btn-logout">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h2>Clientes</h2>
                <p>Gestión de clientes del lavadero</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()">+ Nuevo Cliente</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientList"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="clientModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Nuevo Cliente</h2>
            <form id="clientForm">
                <input type="hidden" id="clientId">
                <div class="form-group">
                    <label for="clientName">Nombre</label>
                    <input type="text" id="clientName" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <label for="clientPhone">Teléfono</label>
                    <input type="text" id="clientPhone" placeholder="Número de teléfono" required>
                </div>
                <div class="form-group">
                    <label for="clientEmail">Email</label>
                    <input type="email" id="clientEmail" placeholder="Correo electrónico">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Guardar</button>
            </form>
        </div>
    </div>
    <script src="js/clients.js"></script>
</body>

</html>
