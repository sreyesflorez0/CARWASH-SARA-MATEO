<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos - CarWash Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav>
        <span class="brand">🚿 CarWash Manager</span>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="clients.html">Clientes</a>
            <a href="vehicles.html" class="active">Vehículos</a>
            <a href="services.html">Servicios</a>
            <a href="orders.html">Órdenes</a>
            <a href="employees.html">Empleados</a>
            <a href="reports.html">Reportes</a>
        </div>
        <div class="nav-actions">
            <button id="logoutBtn" class="btn btn-logout">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h2>Vehículos</h2>
                <p>Gestión de vehículos registrados</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()">+ Nuevo Vehículo</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Color</th>
                        <th>Propietario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="vehicleList"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="vehicleModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Nuevo Vehículo</h2>
            <form id="vehicleForm">
                <input type="hidden" id="vehicleId">
                <div class="form-group">
                    <label for="vehicleClient">Propietario</label>
                    <select id="vehicleClient" required></select>
                </div>
                <div class="form-group">
                    <label for="vehiclePlate">Placa</label>
                    <input type="text" id="vehiclePlate" placeholder="ABC123" required>
                </div>
                <div class="form-group">
                    <label for="vehicleBrand">Marca</label>
                    <input type="text" id="vehicleBrand" placeholder="Toyota" required>
                </div>
                <div class="form-group">
                    <label for="vehicleModel">Modelo</label>
                    <input type="text" id="vehicleModel" placeholder="Corolla" required>
                </div>
                <div class="form-group">
                    <label for="vehicleColor">Color</label>
                    <input type="text" id="vehicleColor" placeholder="Blanco">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Guardar</button>
            </form>
        </div>
    </div>
    <script src="js/vehicles.js"></script>
</body>

</html>
